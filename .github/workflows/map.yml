name: Karte bauen (echte Daten)

# Laedt OpenStreetMap + Hoehenmodell, baut public/world und committet es.
# Danach wird WIBA.exe automatisch neu gebaut.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wiba-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kartenbau-Test
        run: node test/map-test.js

      - name: OpenStreetMap-Auszug laden und Gebiet ausschneiden
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -L --fail --retry 5 -o austria.osm.pbf https://download.geofabrik.de/europe/austria-latest.osm.pbf
          ls -la austria.osm.pbf
          osmium extract -b 13.43,47.77,13.77,48.06 austria.osm.pbf -o region.osm.pbf
          osmium export region.osm.pbf -f geojsonseq -o region.geojsonseq
          rm austria.osm.pbf
          ls -la region.osm.pbf region.geojsonseq
          head -c 600 region.geojsonseq

      - name: Karte bauen
        run: node tools/build-map.js --out public/world --cache .cache/map --geojson region.geojsonseq

      - name: Ergebnis pruefen
        run: |
          du -sh public/world public/world/tiles
          ls public/world | head -20
          node -e "const m=require('./public/world/meta.json'); console.log(JSON.stringify(m.counts), 'Seen:', m.lakes.length, 'Kacheln:', m.tiles.length); if(!m.counts.buildings||!m.counts.roads||!m.lakes.length) process.exit(1)"

      - name: Karte committen
        run: |
          git config user.name "WIBA Kartenbau"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/world
          git commit -q -m "Echte Karte: Voecklabruck - Attersee - Weissenbachtal (OSM + Hoehenmodell)" || echo "keine Aenderung"
          git pull --rebase -q origin "${{ github.ref_name }}"
          git push

      - name: WIBA.exe neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
